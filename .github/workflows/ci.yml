name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SCII_GATE_COMMIT: d210811f27a9b9302f018faf7f019d38dfbb9227
  COSIGN_VERSION: v2.4.1
  COSIGN_SHA256: 8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b

jobs:
  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pymonocypher 3.1.3.2 (проверка подписи загрузчика ArduPilot, s51) собирается под 3.11, но не под 3.13
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Установка (версии и хеши закреплены)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: scii-gate на закреплённом коммите
        run: |
          git clone -q https://github.com/alexqzm/scii-gate "$RUNNER_TEMP/scii-gate"
          git -C "$RUNNER_TEMP/scii-gate" checkout -q "$SCII_GATE_COMMIT"
          echo "SCII_GATE=$RUNNER_TEMP/scii-gate" >> "$GITHUB_ENV"
      - name: Протокол не менялся после фиксации
        run: sha256sum -c docs/PROTOCOL.sha256
      - name: Тесты (модель нарушителя по протоколу, правила ВАК-2, согласованность результатов)
        run: python -m pytest -q
      - name: Перебор наборов компрометации совпадает с results/analysis.json
        run: |
          python -m adv.analysis --out "$RUNNER_TEMP/analysis.json"
          python -m adv.compare analysis "$RUNNER_TEMP/analysis.json"
      - name: Сводка results/summary.md совпадает с результатами
        run: |
          python -m adv.report
          git diff --exit-code results/summary.md

  monotonicity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Установка (версии и хеши закреплены)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: scii-gate на закреплённом коммите
        run: |
          git clone -q https://github.com/alexqzm/scii-gate "$RUNNER_TEMP/scii-gate"
          git -C "$RUNNER_TEMP/scii-gate" checkout -q "$SCII_GATE_COMMIT"
          echo "SCII_GATE=$RUNNER_TEMP/scii-gate" >> "$GITHUB_ENV"
      - name: Монотонность исходов всех правил (полный перебор и выборка), сверка с results/
        run: |
          python -m adv.monotonicity --out "$RUNNER_TEMP/monotonicity.json"
          python -m adv.compare monotonicity "$RUNNER_TEMP/monotonicity.json"

  emulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Установка (версии и хеши закреплены)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: cosign (SHA-256 закреплён)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "SCII_COSIGN=$RUNNER_TEMP/bin/cosign" >> "$GITHUB_ENV"
      - name: scii-gate на закреплённом коммите
        run: |
          git clone -q https://github.com/alexqzm/scii-gate "$RUNNER_TEMP/scii-gate"
          git -C "$RUNNER_TEMP/scii-gate" checkout -q "$SCII_GATE_COMMIT"
          echo "SCII_GATE=$RUNNER_TEMP/scii-gate" >> "$GITHUB_ENV"
      - name: Г0 и Г7 — перевыпуск ключей, комплекты нарушителя, прогон scii verify, сверка с results/
        run: |
          ADV_WORK="$RUNNER_TEMP/work" python -m adv.emulate all --out "$RUNNER_TEMP/emulation.json"
          python -m adv.compare emulation "$RUNNER_TEMP/emulation.json"

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Установка (версии и хеши закреплены)
        run: python -m pip install --require-hashes -r requirements.txt
      - name: cosign (SHA-256 закреплён)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "SCII_COSIGN=$RUNNER_TEMP/bin/cosign" >> "$GITHUB_ENV"
      - name: scii-gate на закреплённом коммите
        run: |
          git clone -q https://github.com/alexqzm/scii-gate "$RUNNER_TEMP/scii-gate"
          git -C "$RUNNER_TEMP/scii-gate" checkout -q "$SCII_GATE_COMMIT"
          echo "SCII_GATE=$RUNNER_TEMP/scii-gate" >> "$GITHUB_ENV"
      # Искажения, исчерпывающие память машины (ссылка на /dev/zero вместо файла, который гейт читает целиком),
      # в CI пропускаются: они могут остановить сам исполнитель CI. Полный прогон — results/mutation.json.
      - name: Г8 — искажённые комплекты, сверка с results/ (без искажений, исчерпывающих память)
        run: |
          ADV_WORK="$RUNNER_TEMP/work" python -m adv.mutate --skip-memory --out "$RUNNER_TEMP/mutation.json"
          python -m adv.compare mutation "$RUNNER_TEMP/mutation.json" --subset

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (SHA-256 закреплён)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
